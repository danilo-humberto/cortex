<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cortex-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="52%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <radialGradient id="cortex-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(16 12) scale(38)">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cortex-aura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(36.5 32) scale(19)">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cortex-c" x1="31" y1="14" x2="31" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>
    <linearGradient id="cortex-synapse" x1="26" y1="32" x2="39" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>
    <linearGradient id="cortex-rim" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#cortex-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#cortex-glow)" />
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#cortex-aura)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" stroke="url(#cortex-rim)" stroke-width="1.5" />

  <!-- Cerebral "C" Hemisphere -->
  <path
    d="M 42.73 19.42 A 17.2 17.2 0 1 0 42.73 44.58"
    stroke="url(#cortex-c)"
    stroke-width="6.4"
    stroke-linecap="round"
  />

  <!-- Inner Neural Synapse & Code Pulse (>) -->
  <path
    d="M 27.5 24.5 L 36.2 32 L 27.5 39.5"
    stroke="url(#cortex-synapse)"
    stroke-width="4.3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="27.5" cy="24.5" r="2.55" fill="#7dd3fc" />
  <circle cx="27.5" cy="39.5" r="2.55" fill="#7dd3fc" />
  <circle cx="36.5" cy="32" r="3.1" fill="#e0f7ff" />
</svg>
